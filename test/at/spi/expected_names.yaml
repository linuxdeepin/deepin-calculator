# AT-SPI expected accessible names for deepin-calculator
# Generated by at-spi-ui-map scan
# Icon-only buttons (no visible text) get explicit setAccessibleName;
# Text buttons rely on Qt's automatic accessible name from button text.
---
window:
  - name: "Calculator"
    role: "frame"
    children:
      - name: "Standard"
        role: "panel"
        children:
          - name: "InputField"
            role: "text"
          - name: "BasicKeypad"
            role: "panel"
            known-buttons:
              # Text buttons (visible text is accessible name)
              - text: "C"
              - text: "%"
              - text: "7"
              - text: "8"
              - text: "9"
              - text: "4"
              - text: "5"
              - text: "6"
              - text: "1"
              - text: "2"
              - text: "3"
              - text: "0"
              - text: "."
              - text: "(  )"
              - text: "="
              # Icon-only buttons (explicit accessible names)
              - name: "Backspace"
              - name: "Divide"
              - name: "Multiply"
              - name: "Minus"
              - name: "Plus"
      - name: "Scientific"
        role: "panel"
        children:
          - name: "ScientificInputField"
            role: "text"
          - name: "ScientificKeypad"
            role: "panel"
            known-buttons:
              # Icon-only buttons
              - name: "AngleUnit"
              - name: "Backspace"
              - name: "Divide"
              - name: "Multiply"
              - name: "Minus"
              - name: "Plus"
              # Page-2 icon-only buttons
              - name: "SquareRoot"
              - name: "CubeRoot"
              - name: "YRoot"
      - name: "Programmer"
        role: "panel"
        children:
          - name: "ProgrammerInputField"
            role: "text"
          - name: "ProgrammerKeypad"
            role: "panel"
            known-buttons:
              # Icon-only buttons
              - name: "Backspace"
              - name: "Divide"
              - name: "Multiply"
              - name: "Minus"
              - name: "Plus"
          - name: "BinaryKeypad"
            role: "panel"
          - name: "Option"
            role: "push button"
          - name: "GeneralKeypad"
            role: "push button"